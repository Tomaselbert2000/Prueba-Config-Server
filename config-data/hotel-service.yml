spring:
  application:
    name: hotelservice
server:
  port: 8083
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
h2:
  console:
    enabled: true
    path: /h2-console
jpa:
  database-platform: org.hibernate.dialect.H2Dialect
datasource:
  url: jdbc:h2:mem:testdb
  username: sa
  password: ""
hibernate:
  ddl-auto: update
